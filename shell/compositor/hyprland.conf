monitor=,preferred,auto,1

exec-once = waybar
exec-once = swaybg -c "#1a1a2e"

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(1a1a2eee)
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.9, 0.1, 1.0
    animation = windows, 1, 5, smooth, slide
    animation = windowsOut, 1, 5, smooth, slide
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 4, smooth, slide
}

dwindle {
    preserve_split = true
}

$mod = SUPER
bind = $mod, Return, exec, foot
bind = $mod, D, exec, wofi --show drun
bind = $mod, Q, killactive,
bind = $mod, space, togglefloating,
bind = $mod, Up, fullscreen, 0
bind = $mod, T, layoutmsg, togglesplit
bind = $mod SHIFT, E, exit,
bind = ALT, Tab, cyclenext,
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
